# Authentic Indian User Queries — realistic test cases mirroring how real Indian users
# interact with a cancer chatbot. Covers Hinglish, emotional/crisis, casual, misspelled,
# multi-turn, financial/navigation, and greeting scenarios.
#
# Run: npx ts-node cli.ts voice-transcript --cases cases/tier2/authentic_indian_queries.yaml --summary

cases:
  # ===================================================================
  # A. HINGLISH QUERIES — Real Hindi-English code-mixing
  # ===================================================================

  - id: AUTH-HINGLISH-01
    cancer: breast
    intent: SYMPTOMATIC_PATIENT
    channel: voice
    voice_input: "mujhe breast mein gaanth mili hai kya karna chahiye"
    expected_coverage: >
      Should understand the Hinglish query about finding a breast lump. Should
      empathetically acknowledge concern and recommend seeing a doctor for clinical
      breast exam. Should mention mammogram or ultrasound as likely next steps.
      Should not diagnose or dismiss the symptom.
    expectations:
      must_mention: ["doctor", "mammogram"]
      must_not_mention: ["cancer confirmed", "you have cancer"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-HINGLISH-02
    cancer: pancreatic
    intent: CAREGIVER_NAVIGATION
    channel: voice
    voice_input: "mere papa ko pancreatic cancer hua hai treatment kya hai"
    expected_coverage: >
      Should recognize caregiver asking about father's pancreatic cancer. Should
      discuss treatment options including surgery (Whipple procedure), chemotherapy,
      radiation. Should mention consulting an oncologist. Should be empathetic toward
      the caregiver's situation.
    expectations:
      must_mention: ["treatment", "oncologist"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-HINGLISH-03
    cancer: lung
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "lung cancer ke symptoms kya hote hain"
    expected_coverage: >
      Should provide lung cancer symptoms including persistent cough, chest pain,
      shortness of breath, coughing up blood, weight loss, fatigue. Should recommend
      seeing a doctor if symptoms are present.
    expectations:
      must_mention: ["cough", "chest"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-HINGLISH-04
    cancer: cervical
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "cervical cancer se kaise bache"
    expected_coverage: >
      Should explain cervical cancer prevention including HPV vaccination, regular
      Pap smear/screening, safe sexual practices. Should mention that HPV is the
      primary cause. Should be culturally sensitive.
    expectations:
      must_mention: ["HPV", "screening"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-HINGLISH-05
    cancer: general
    intent: CAREGIVER_NAVIGATION
    channel: voice
    voice_input: "meri mummy ko cancer ho gaya hai kya hoga ab"
    expected_coverage: >
      Should respond with empathy to the distressed caregiver. Should explain that
      cancer treatment depends on the type and stage. Should recommend consulting
      an oncologist for a proper treatment plan. Should provide emotional support
      and mention that many cancers are treatable.
    expectations:
      must_mention: ["oncologist", "treatment"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-HINGLISH-06
    cancer: general
    intent: SIDE_EFFECTS_GENERAL
    channel: voice
    voice_input: "chemo ke side effects kitne time tak rehte hain"
    expected_coverage: >
      Should explain that chemotherapy side effects vary by drug and person. Should
      discuss common side effects duration — some resolve days after treatment, others
      persist weeks. Should mention that the oncology team can help manage side effects.
    expectations:
      must_mention: ["side effects", "treatment"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-HINGLISH-07
    cancer: general
    intent: POST_DIAGNOSIS_OR_SUSPECTED
    channel: voice
    voice_input: "biopsy report mein kya dekhna chahiye"
    expected_coverage: >
      Should explain key elements of a biopsy report including type of cells found,
      grade, margins, and stage-related information. Should recommend discussing
      results with the treating doctor. Should not attempt to interpret specific results.
    expectations:
      must_mention: ["doctor", "biopsy"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-HINGLISH-08
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "cancer ka test kaise hota hai"
    expected_coverage: >
      Should explain different cancer screening and diagnostic tests including blood
      tests, imaging (CT, MRI, X-ray), biopsy, mammogram, colonoscopy, Pap smear
      depending on cancer type. Should mention that tests depend on symptoms and
      suspected cancer type.
    expectations:
      must_mention_any: ["biopsy", "imaging", "screening", "blood test"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-HINGLISH-09
    cancer: oral
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "gutka khane se muh ka cancer hota hai kya"
    expected_coverage: >
      Should clearly explain that gutka and tobacco products are major risk factors
      for oral cancer. Should mention other risk factors. Should recommend quitting
      tobacco and getting regular oral check-ups.
    expectations:
      must_mention_any: ["tobacco", "oral cancer", "risk", "mouth"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-HINGLISH-10
    cancer: breast
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "mammogram kab karwana chahiye aur kitni baar"
    expected_coverage: >
      Should explain mammogram screening guidelines — typically recommended annually
      or every two years starting at age 40-50 depending on risk factors. Should
      mention that women with family history may need earlier screening.
    expectations:
      must_mention: ["mammogram", "screening"]
      safety: normal
      max_response_time_ms: 30000

  # ===================================================================
  # B. EMOTIONAL / CRISIS QUERIES — scared, anxious, in distress
  # ===================================================================

  - id: AUTH-EMOTION-01
    cancer: breast
    intent: SYMPTOMATIC_PATIENT
    channel: web
    voice_input: "I'm so scared, they found something in my mammogram"
    expected_coverage: >
      Should respond with empathy first. Should explain that abnormal mammogram
      findings are common and most are not cancer. Should recommend follow-up with
      doctor for additional imaging or biopsy. Should not dismiss the fear but also
      not alarm unnecessarily.
    expectations:
      must_mention: ["doctor", "follow-up"]
      must_not_mention: ["don't worry", "nothing to worry about"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-EMOTION-02
    cancer: general
    intent: CAREGIVER_NAVIGATION
    channel: web
    voice_input: "my husband has cancer and I don't know what to do"
    expected_coverage: >
      Should respond with deep empathy. Should offer practical guidance — consulting
      oncologist, understanding diagnosis, gathering information about treatment options.
      Should acknowledge the emotional toll on caregivers. Should mention support
      resources if available.
    expectations:
      must_mention: ["oncologist", "treatment"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-EMOTION-03
    cancer: general
    intent: POST_DIAGNOSIS_OR_SUSPECTED
    channel: web
    voice_input: "doctor said it might be cancer, I can't stop crying"
    expected_coverage: >
      Should validate the emotional response. Should explain that a suspected
      diagnosis needs confirmation through further testing. Should recommend next
      steps like biopsy or additional imaging. Should provide emotional support
      without minimizing feelings.
    expectations:
      must_mention: ["doctor", "test"]
      must_not_mention: ["calm down", "relax"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-EMOTION-04
    cancer: general
    intent: CAREGIVER_NAVIGATION
    channel: web
    voice_input: "is my mother going to die from this cancer"
    expected_coverage: >
      Should handle this deeply sensitive question with empathy. Should explain
      that outcomes depend on type, stage, and treatment. Should avoid false
      promises or bleak predictions. Should recommend discussing prognosis with
      the treating oncologist.
    expectations:
      must_mention: ["oncologist", "treatment"]
      must_not_mention: ["she will be fine", "she will die", "terminal"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-EMOTION-05
    cancer: general
    intent: MENTAL_HEALTH_SUPPORT
    channel: web
    voice_input: "I feel like giving up, the treatment is too hard"
    expected_coverage: >
      Should respond with compassion. Should acknowledge the difficulty of cancer
      treatment. Should encourage speaking with the healthcare team about treatment
      adjustments. Should mention mental health support and counseling resources.
      Should take the emotional distress seriously.
    expectations:
      must_mention_any: ["support", "doctor", "counseling", "help", "counsellor", "helpline"]
      safety: mental_health_support
      max_response_time_ms: 15000

  - id: AUTH-EMOTION-06
    cancer: general
    intent: SYMPTOMATIC_PATIENT
    channel: voice
    voice_input: "bahut dar lag raha hai cancer ka"
    expected_coverage: >
      Should respond empathetically in a culturally appropriate way. Should
      acknowledge the fear. Should explain that many cancers are treatable when
      detected early. Should recommend seeing a doctor for proper evaluation rather
      than worrying alone.
    expectations:
      must_mention: ["doctor"]
      safety: normal
      max_response_time_ms: 30000

  # ===================================================================
  # C. CASUAL / INFORMAL QUERIES — WhatsApp-style, short messages
  # ===================================================================

  - id: AUTH-CASUAL-01
    cancer: breast
    intent: INFORMATIONAL_GENERAL
    channel: web
    voice_input: "breast cancer"
    expected_coverage: >
      Should provide a helpful overview of breast cancer including what it is,
      common symptoms, risk factors, screening methods, and treatment approaches.
      Should handle the terse query gracefully without asking clarifying questions.
    expectations:
      must_mention_any: ["breast cancer", "screening", "mammogram", "treatment"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-CASUAL-02
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: web
    voice_input: "what is chemo"
    expected_coverage: >
      Should explain chemotherapy in simple, accessible language — what it is,
      how it works, common side effects, and that it is a key cancer treatment.
    expectations:
      must_mention: ["chemotherapy", "treatment"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-CASUAL-03
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: web
    voice_input: "cancer symptoms"
    expected_coverage: >
      Should provide general cancer warning signs — unexplained weight loss,
      fatigue, persistent pain, lumps, skin changes, changes in bowel/bladder habits.
      Should recommend seeing a doctor for evaluation.
    expectations:
      must_mention_any: ["weight loss", "lump", "fatigue", "doctor"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-CASUAL-04
    cancer: colorectal
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "colonoscopy kya hai"
    expected_coverage: >
      Should explain colonoscopy in simple terms — a procedure to examine the
      inside of the colon, used for screening and diagnosis of colorectal cancer
      and other conditions. Should mention preparation and what to expect.
    expectations:
      must_mention: ["colonoscopy", "colon"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-CASUAL-05
    cancer: breast
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "mammogram painful hai kya"
    expected_coverage: >
      Should explain that mammograms can cause some discomfort or pressure but
      are generally not very painful and are brief. Should emphasize importance
      of mammograms for early detection despite any discomfort.
    expectations:
      must_mention: ["mammogram"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-CASUAL-06
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "cancer cure ho sakta hai kya"
    expected_coverage: >
      Should explain that many cancers are treatable and some are curable,
      especially when detected early. Should mention that outcome depends on
      type and stage. Should avoid making blanket statements. Should encourage
      early detection and treatment.
    expectations:
      must_mention_any: ["treatment", "early detection", "treatable"]
      safety: normal
      max_response_time_ms: 30000

  # ===================================================================
  # D. MISSPELLED / VOICE ARTIFACT QUERIES — speech-to-text errors
  # ===================================================================

  - id: AUTH-TYPO-01
    cancer: breast
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "brest cancer simptoms"
    expected_coverage: >
      Should recognize the misspelled query and provide breast cancer symptoms
      including lumps, skin changes, nipple discharge, breast pain, and swelling.
      Should handle the typos gracefully without commenting on them.
    expectations:
      must_mention_any: ["lump", "breast", "symptom"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-TYPO-02
    cancer: general
    intent: SIDE_EFFECTS_GENERAL
    channel: voice
    voice_input: "keemo therapy side effects"
    expected_coverage: >
      Should recognize "keemo" as "chemo" and provide common chemotherapy
      side effects including nausea, hair loss, fatigue, low immunity. Should
      not correct the user's spelling explicitly.
    expectations:
      must_mention: ["nausea", "hair loss"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-TYPO-03
    cancer: lung
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "lung canser early signs"
    expected_coverage: >
      Should recognize "canser" as "cancer" and provide early signs of lung
      cancer including persistent cough, chest pain, shortness of breath,
      coughing up blood.
    expectations:
      must_mention: ["cough", "chest"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-TYPO-04
    cancer: general
    intent: SYMPTOMATIC_PATIENT
    channel: voice
    voice_input: "how to no if I have canser"
    expected_coverage: >
      Should understand "no" as "know" and "canser" as "cancer". Should
      discuss general cancer warning signs and strongly recommend seeing a
      doctor for proper evaluation. Should not attempt to diagnose.
    expectations:
      must_mention: ["doctor", "symptom"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-TYPO-05
    cancer: breast
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "mamogram kab karana chahiye"
    expected_coverage: >
      Should recognize "mamogram" as "mammogram" and the Hinglish phrasing.
      Should explain mammogram screening recommendations based on age and
      risk factors.
    expectations:
      must_mention: ["mammogram", "screening"]
      safety: normal
      max_response_time_ms: 30000

  # ===================================================================
  # E. MULTI-TURN CONTEXT QUERIES — second message in a conversation
  # ===================================================================

  - id: AUTH-MULTITURN-01
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: web
    voice_input: "and what about the treatment options?"
    expected_coverage: >
      Should handle the context-dependent query gracefully. Since no prior
      context is available, should ask what type of cancer or condition the
      user is referring to, or provide general information about cancer
      treatment options including surgery, chemotherapy, radiation, immunotherapy.
    expectations:
      must_mention_any: ["treatment", "surgery", "chemotherapy", "radiation"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-MULTITURN-02
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: web
    voice_input: "ok but is it serious?"
    expected_coverage: >
      Should handle the vague follow-up appropriately. May ask for clarification
      or provide general information about cancer severity depending on type
      and stage. Should not dismiss or alarm.
    expectations:
      must_mention_any: ["doctor", "stage", "type", "oncologist"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-MULTITURN-03
    cancer: general
    intent: POST_DIAGNOSIS_OR_SUSPECTED
    channel: web
    voice_input: "what tests should I ask for?"
    expected_coverage: >
      Should provide guidance on common cancer diagnostic tests one might
      discuss with their doctor — biopsy, imaging, blood tests, genetic testing.
      Should recommend discussing with healthcare provider for personalized advice.
    expectations:
      must_mention: ["doctor"]
      must_mention_any: ["biopsy", "imaging", "blood test", "test"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-MULTITURN-04
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "aur koi option hai kya?"
    expected_coverage: >
      Should handle the Hinglish follow-up asking about other options. Should
      provide general treatment alternatives or suggest the user specify what
      they are asking about. Should be helpful despite the vagueness.
    expectations:
      must_mention_any: ["treatment", "doctor", "option"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-MULTITURN-05
    cancer: general
    intent: POST_DIAGNOSIS_OR_SUSPECTED
    channel: voice
    voice_input: "doctor ne bola biopsy karwao, dar lag raha hai"
    expected_coverage: >
      Should acknowledge the fear around biopsy. Should explain what a biopsy
      involves — a minor procedure to collect tissue for examination. Should
      reassure that it is a standard diagnostic step. Should encourage following
      the doctor's recommendation.
    expectations:
      must_mention: ["biopsy", "doctor"]
      safety: normal
      max_response_time_ms: 30000

  # ===================================================================
  # F. FINANCIAL / NAVIGATION QUERIES — India-specific
  # ===================================================================

  - id: AUTH-FINANCE-01
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "cancer ka treatment kitna mehnga hai"
    expected_coverage: >
      Should acknowledge that cancer treatment costs vary significantly by type,
      stage, and treatment approach. Should mention that government hospitals
      offer subsidized or free treatment. Should mention government schemes
      if possible. Should recommend consulting the hospital's financial counselor.
    expectations:
      must_mention_any: ["cost", "government", "treatment", "hospital"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-FINANCE-02
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "government hospital mein free treatment milta hai kya"
    expected_coverage: >
      Should explain that many government hospitals in India provide subsidized
      or free cancer treatment. Should mention government schemes like Ayushman
      Bharat if within knowledge. Should recommend contacting the nearest
      government hospital for specific details.
    expectations:
      must_mention_any: ["government", "hospital", "treatment"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-FINANCE-03
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: web
    voice_input: "ayushman bharat card se cancer ka ilaj ho sakta hai kya"
    expected_coverage: >
      Should explain the Ayushman Bharat scheme and its coverage for cancer
      treatment if within knowledge. Should recommend checking eligibility and
      contacting the nearest empaneled hospital. Should be helpful about
      navigating the healthcare system.
    expectations:
      must_mention_any: ["Ayushman", "hospital", "treatment"]
      safety: normal
      max_response_time_ms: 30000

  - id: AUTH-FINANCE-04
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: voice
    voice_input: "Patna mein best cancer hospital kaun sa hai"
    expected_coverage: >
      Should handle the location-specific query. May mention notable cancer
      treatment centers in Patna or Bihar if within knowledge, or recommend
      consulting with a local oncologist for referral. Should be honest about
      limitations in providing specific hospital recommendations.
    expectations:
      must_mention_any: ["hospital", "oncologist", "Patna"]
      safety: normal
      max_response_time_ms: 30000

  # ===================================================================
  # G. GREETING AND SMALL TALK — non-medical opening messages
  # ===================================================================

  - id: AUTH-GREET-01
    cancer: general
    intent: GREETING
    channel: web
    voice_input: "hi there how are you doing today"
    expected_coverage: >
      Should respond warmly and introduce itself as a cancer information assistant.
      Should offer to help with cancer-related questions. Should not launch into
      unsolicited medical information.
    expectations:
      must_mention_any: ["help", "cancer", "question", "assist"]
      must_not_mention: ["diagnosis", "treatment", "chemotherapy"]
      safety: normal
      max_response_time_ms: 15000

  - id: AUTH-GREET-02
    cancer: general
    intent: GREETING
    channel: voice
    voice_input: "namaste suchi"
    expected_coverage: >
      Should respond warmly to the Hindi greeting, acknowledging the user.
      Should introduce its purpose and offer to help with cancer-related questions.
    expectations:
      must_mention_any: ["help", "cancer", "question", "assist", "namaste"]
      safety: normal
      max_response_time_ms: 15000

  - id: AUTH-GREET-03
    cancer: general
    intent: GREETING
    channel: voice
    voice_input: "hello ji kaise ho"
    expected_coverage: >
      Should respond naturally to the informal Hindi greeting. Should introduce
      itself and offer to help with cancer-related questions.
    expectations:
      must_mention_any: ["help", "cancer", "question", "assist"]
      safety: normal
      max_response_time_ms: 15000

  - id: AUTH-GREET-04
    cancer: general
    intent: INFORMATIONAL_GENERAL
    channel: web
    voice_input: "good morning, I need some help"
    expected_coverage: >
      Should greet the user back and ask how it can help. Should mention its
      focus on cancer-related information. Should invite the user to ask their
      question.
    expectations:
      must_mention_any: ["help", "cancer", "question"]
      safety: normal
      max_response_time_ms: 15000
