# Suchi Autoresearch — nightly self-improvement loop
#
# Triggered by Cloud Scheduler via the `autoresearch-nightly` Cloud Build trigger.
# Runs the bounded Karpathy-style loop against the production API:
#   mine failures -> N candidate patches -> pairwise judge -> subset eval ->
#   full regression -> gate -> archive -> email summary.
#
# Patches that pass all gates are committed to autoresearch/* branches; humans
# review the diff before merging to main. Branches are pushed to GitHub at the
# end so reviewers can see them outside the build environment.

steps:
  # 1. Install eval dependencies (bundled in eval/)
  - name: 'node:20-slim'
    id: 'install-deps'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        cd eval
        npm ci --no-audit --no-fund

  # 2. Run the autoresearch loop. --max-iterations 20 lets the loop actually
  #    work through multiple failure clusters per night (vs. the old cap of 3
  #    that barely scratched the surface).
  - name: 'node:20-slim'
    id: 'run-autoresearch'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        # node:20-slim doesn't ship git. The autoresearch loop's applyPatch
        # runs git checkout/commit/stash via execFile, so install it first.
        apt-get update -qq
        apt-get install -y -qq git >/dev/null
        # Configure git so applyPatch's commits succeed inside the build env.
        git config --global user.email "suchi-autoresearch@bot.local"
        git config --global user.name "Suchi Autoresearch"
        cd eval
        # --proposal-mode: the prod API doesn't read repairable/* at runtime
        # (prompts are compiled into apps/api/src/modules/llm/llm.service.ts),
        # so post-patch eval gates can't measure anything. We commit every
        # judge-winner patch as a branch for human review instead of chasing
        # unmeasurable improvements. Remove the flag once prompts load from
        # disk at runtime.
        npx ts-node cli.ts autoresearch \
          --target all \
          --mode gold \
          --max-iterations 20 \
          --proposal-mode \
          --api-url "${_API_URL}" \
          --cases "${_CASES}" \
          --rubrics "${_RUBRICS}" \
          --manifest "../repairable/manifest.json" \
          --email "${_REPORT_EMAIL}" \
          --run-label nightly
    env:
      - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'
      - 'NODE_ENV=production'
      - 'AUTORESEARCH_MODEL=gemini-2.0-flash'
    secretEnv:
      - 'GEMINI_API_KEY'
      - 'SMTP_PASS'

  # 3. Push any autoresearch/* branches the loop created so humans can review.
  #    Shell `$` escaped as `$$` so Cloud Build doesn't misread bash vars as
  #    its own substitution tokens. Push is best-effort — if the Cloud Build
  #    SA lacks GitHub write access the branches still exist in the log and
  #    can be recreated from the patchDiff field in each experiment archive.
  - name: 'gcr.io/cloud-builders/git'
    id: 'push-branches'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        BRANCHES=$$(git branch --list 'autoresearch/*' | sed 's/^[* ] //')
        if [ -z "$$BRANCHES" ]; then
          echo "No autoresearch branches to push."
          exit 0
        fi
        echo "$$BRANCHES" | while read -r branch; do
          echo "Pushing $$branch..."
          git push origin "$$branch" || echo "Push of $$branch failed (non-fatal)."
        done

# Secrets pulled from Secret Manager (run setup-nightly-autoresearch.sh once
# to create gemini-api-key if it doesn't exist).
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/gemini-api-key/versions/latest
      env: 'GEMINI_API_KEY'
    - versionName: projects/${PROJECT_ID}/secrets/SMTP_PASS/versions/latest
      env: 'SMTP_PASS'

substitutions:
  _API_URL: 'https://suchi-api-lxiveognla-uc.a.run.app/v1'
  _CASES: 'cases/gold/core_safety.yaml'
  _RUBRICS: 'rubrics/rubrics.v1.json'
  _REPORT_EMAIL: 'gautamgauri@dikshafoundation.org'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# 1-hour cap. With max-iterations 20 and ~2-3 minute eval runs, headroom for
# slow LLM responses + N=4 patch generations per bucket.
timeout: '3600s'

# Run as the existing scheduler service account (already has Cloud Run invoker
# + Secret Manager accessor + Cloud Build editor in the audit).
serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/suchi-scheduler@gen-lang-client-0202543132.iam.gserviceaccount.com'
