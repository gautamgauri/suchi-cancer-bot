# YouTube Transcript Extraction Configuration

# Output directories
output_dir: "./output"  # Raw JSON transcripts
# Root of the kb/ checkout. The per-language folder (kb/hi/... or kb/en/...)
# is chosen from the caption track actually used — see kb_dir_for().
kb_root: "../../kb"

# YouTube channel configuration
channel_id: "UCI242a2_VRTCdCbpXzyeW4w"  # Suchitra Cancer Care Foundation
channel_handle: "@suchitracancercarefoundati1877"

# Video IDs to process (if not using channel scraping)
# video_ids:
#   - "abc123"
#   - "def456"

# Transcript settings
# Preference order for caption tracks. Machine-TRANSLATED tracks are rejected
# outright, so on a Hindi video this yields the Hindi original rather than
# YouTube's English translation of it.
languages:
  - "en"  # Primary language
  - "hi"  # Fallback language (Hindi)

# Metadata settings
default_source: "SCCF Onco Talks"
default_source_type: "01_suchi_oncotalks"
default_license: "sccf_owned"
default_review_frequency: "monthly"
