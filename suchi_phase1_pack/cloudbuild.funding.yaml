# Cloud Build for funding-api (FundingBot) — mirrors root cloudbuild.yaml pattern.
# Build from apps/funding-api, deploy to Cloud Run as funding-api. No CloudSQL.
#
# Manual (from repo root): gcloud builds submit --config suchi_phase1_pack/cloudbuild.funding.yaml .
# Override secret name: --substitutions _FUNDING_LLM_API_KEY_SECRET=YOUR_SECRET_NAME
# Trigger: point at this file; included files e.g. suchi_phase1_pack/apps/funding-api/**

steps:
  # Build Funding API Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-funding-api'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-api:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-api:latest'
      - '-f'
      - 'suchi_phase1_pack/apps/funding-api/Dockerfile'
      - 'suchi_phase1_pack/apps/funding-api'

  # Push Funding API image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-funding-api'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-api'

  # Deploy Funding API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-funding-api'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_FUNDING_API_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-api:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=8080,GIT_SHA=$BUILD_ID,FUNDING_MODEL_DRAFT=${_FUNDING_MODEL_DRAFT},FUNDING_LLM_TIMEOUT_MS=${_FUNDING_LLM_TIMEOUT_MS}'
      - '--set-secrets'
      - 'FUNDING_OPENAI_API_KEY=${_FUNDING_LLM_API_KEY_SECRET}:latest'

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REGISTRY: 'suchi-images'
  _FUNDING_API_SERVICE_NAME: 'funding-api'

  # Keep defaults low-friction; override in trigger if needed
  _FUNDING_MODEL_DRAFT: 'deepseek-chat'
  _FUNDING_LLM_TIMEOUT_MS: '45000'

  # Same Secret Manager secret Suchi uses (DEEPSEEK_API_KEY=deepseek-api-key:latest). Env var name stays FUNDING_OPENAI_API_KEY.
  _FUNDING_LLM_API_KEY_SECRET: 'deepseek-api-key'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
