# Cloud Build for Diksha Funding Bot (API + Web)
# Deploys both funding-api and funding-web to Cloud Run
#
# Manual: gcloud builds submit --config suchi_phase1_pack/cloudbuild.funding.yaml .
# Trigger: point at this file; included files e.g. suchi_phase1_pack/apps/funding-api/** suchi_phase1_pack/apps/funding-web/**

steps:
  # Build Funding API Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-funding-api'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-api:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-api:latest'
      - '-f'
      - 'suchi_phase1_pack/apps/funding-api/Dockerfile'
      - 'suchi_phase1_pack/apps/funding-api'

  # Build Funding Web Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-funding-web'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-web:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-web:latest'
      - '--build-arg'
      - 'VITE_API_URL=${_FUNDING_API_URL}'
      - '-f'
      - 'suchi_phase1_pack/apps/funding-web/Dockerfile'
      - 'suchi_phase1_pack/apps/funding-web'

  # Push Funding API image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-funding-api'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-api'

  # Push Funding Web image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-funding-web'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-web'

  # Update migration job to use the same image as this build
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-funding-migrate-job'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        MIGRATE_IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-api:$BUILD_ID"
        gcloud run jobs update funding-migrate \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --image="$${MIGRATE_IMAGE}" \
          --set-cloudsql-instances="${_CLOUDSQL_CONNECTION_NAME}" \
          --set-secrets="DATABASE_URL=${_FUNDING_DATABASE_SECRET}:latest" \
          --command="prisma" \
          --args="migrate,deploy,--schema,prisma/schema.prisma"

  # Execute migration job and WAIT for completion
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'execute-funding-migrations'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run jobs execute funding-migrate \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --wait

  # Deploy Funding API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-funding-api'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_FUNDING_API_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-api:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'
      - '--add-cloudsql-instances'
      - '${_CLOUDSQL_CONNECTION_NAME}'
      - '--set-env-vars'
      - 'NODE_ENV=production,GIT_SHA=$BUILD_ID,FUNDING_MODEL_DRAFT=${_FUNDING_MODEL_DRAFT},FUNDING_LLM_TIMEOUT_MS=${_FUNDING_LLM_TIMEOUT_MS},FUNDING_OPENAI_BASE_URL=${_FUNDING_OPENAI_BASE_URL},FUNDING_EMBEDDINGS_BASE_URL=${_FUNDING_OPENAI_BASE_URL},EVIDENCE_DRIVE_FOLDER_ID=${_EVIDENCE_DRIVE_FOLDER_ID},FUNDING_EMBEDDING_PROVIDER=google,EVIDENCE_EMBEDDING_MODEL=gemini-embedding-001,FUNDING_GEMINI_GROUNDING_MODEL=gemini-2.0-flash,FUNDING_GMAIL_USER=${_FUNDING_GMAIL_USER},SCCF_DRIVE_FOLDER_ID=${_SCCF_DRIVE_FOLDER_ID}'
      - '--set-secrets'
      - 'FUNDING_OPENAI_API_KEY=${_FUNDING_LLM_API_KEY_SECRET}:latest,DATABASE_URL=${_FUNDING_DATABASE_SECRET}:latest,FUNDING_GOOGLE_SERVICE_ACCOUNT_JSON=${_FUNDING_GOOGLE_SA_SECRET}:latest,FUNDING_GEMINI_API_KEY=${_FUNDING_LLM_API_KEY_SECRET}:latest,FUNDING_EMBEDDINGS_API_KEY=${_FUNDING_LLM_API_KEY_SECRET}:latest'

  # Deploy Funding Web to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-funding-web'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_FUNDING_WEB_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/funding-web:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '60'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--port'
      - '8080'

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REGISTRY: 'suchi-images'
  _FUNDING_API_SERVICE_NAME: 'funding-api'
  _FUNDING_WEB_SERVICE_NAME: 'funding-web'
  _FUNDING_API_URL: 'https://funding-api-lxiveognla-uc.a.run.app'
  _FUNDING_MODEL_DRAFT: 'gemini-2.0-flash'
  _FUNDING_LLM_TIMEOUT_MS: '120000'
  _FUNDING_LLM_API_KEY_SECRET: 'gemini-api-key'
  _FUNDING_OPENAI_BASE_URL: 'https://generativelanguage.googleapis.com/v1beta/openai/'
  _FUNDING_DATABASE_SECRET: 'funding-database-url'
  _FUNDING_GOOGLE_SA_SECRET: 'funding-google-sa-key'
  _EVIDENCE_DRIVE_FOLDER_ID: '0B66dYZSUOOxbeEFLQ19uVnJsdGs'
  _CLOUDSQL_CONNECTION_NAME: 'gen-lang-client-0202543132:us-central1:diksha-db'
  _FUNDING_GMAIL_USER: 'gautamgauri@dikshafoundation.org'
  _SCCF_DRIVE_FOLDER_ID: '1CBOqdC1DTf1_zRJzT_ceoS29DHOVZuEC'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
