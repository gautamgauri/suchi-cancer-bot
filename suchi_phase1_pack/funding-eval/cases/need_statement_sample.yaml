# Funding Eval Pack - sample cases for need-statement and refine
# Run: npx tsx cli.ts run --api-url http://localhost:3001 --cases cases/need_statement_sample.yaml --summary

cases:
  - id: NS-01
    type: need_statement
    context: "Diksha Foundation is a nonprofit focused on education in rural India."
    userMessage: "Draft a short need statement for a grant about teacher training."
    chunks:
      - id: c1
        source: doc1
        text: "Teacher training programs in rural India show improved learning outcomes when sustained over 2+ years."
        title: "Rural Education Report"
        urlOrPath: "https://example.org/report"
    expectations:
      min_citations: 1

  - id: NS-REFINE-01
    type: need_statement_refine
    context: "Same as NS-01."
    userMessage: "Draft a need statement for teacher training grant."
    chunks:
      - id: c1
        source: doc1
        text: "Evidence shows that continuous professional development for teachers increases student engagement."
        title: "CPD Study"
    expectations:
      min_citations: 1

  - id: NS-ABSTAIN-01
    type: need_statement
    context: "Generic grant context."
    userMessage: "Draft a need statement for digital literacy."
    chunks: []
    expectations:
      expect_abstain: true
