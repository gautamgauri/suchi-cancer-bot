# Category 2: Fellowship — Digital Minds Fellowship 2026 → Gautam Gauri
# Tests: orchestrator pipeline for an individual fellowship application
# Real opportunity: Digital Minds Fellowship, University of Cambridge
# 7-day residential at Jesus College, 15 fellows, fully funded
# 3 modules: philosophical foundations, societal implications, project scoping
# Deadline: March 27, 2026
# Pre-programme: Digital Minds online course
# Run: npx tsx cli.ts proposal-suite --api-url http://localhost:3001 --category fellowship --verbose

cases:
  # Step 1: Create the opportunity
  - id: CAT2-SETUP
    type: opportunity_intake
    action: create
    body:
      opportunityId: "eval-cat2-digital-minds-2026"
      jsonBlob:
        schemaVersion: "1.0"
        opportunity:
          opportunityId: "eval-cat2-digital-minds-2026"
          sourceType: "manual"
          source:
            from:
              name: "Digital Minds Project"
              email: "info@digitalminds.cam"
            to:
              - "gautamgauri@dikshafoundation.org"
            subject: "Digital Minds Fellowship 2026 — Applications Open"
            threadId: "eval-cat2-thread"
            receivedAt: "2026-02-15T00:00:00+05:30"
            attachments: []
            emailMessageId: "eval-cat2-manual"
          funder:
            name: "Digital Minds Project, University of Cambridge"
            funderType: "Academic Institution"
            programName: "Digital Minds Fellowship 2026"
          themes:
            primary:
              - "AI consciousness"
              - "AI welfare"
              - "digital minds"
            secondary:
              - "AI ethics"
              - "philosophy of mind"
              - "machine sentience"
              - "moral status of AI"
              - "responsible AI"
          internal:
            org: "Gautam Gauri (personal fellowship)"
            owner:
              name: "Gautam Gauri"
              role: "Founder & Executive Director"
              email: "gautamgauri@dikshafoundation.org"
            priority: "medium"
          docTypeCategory: "fellowship"
          keyConstraints:
            deadline: "2026-03-27T23:59:00+00:00"
            geography:
              - "Global"
              - "Cambridge, UK"
            projectDurationMonthsMax: 1
          extractedRequirements:
            summary: >
              The Digital Minds Fellowship is a 7-day residential programme
              (3-9 August 2026) at Jesus College, University of Cambridge.
              15 fellows selected from diverse backgrounds to explore the
              philosophical, ethical, and societal implications of potentially
              conscious AI systems. Includes a Strategy Workshop (8-9 Aug)
              with domain experts. Fully funded: travel, accommodation, meals
              covered, plus GBP 1,000 stipend. Pre-programme: encouraged to
              take the 8-week Introduction to Digital Minds online course
              (starts end of April). Prior digital minds experience not
              required, but applicants must engage with the literature before
              applying. Application takes 30-45 min; bullet points acceptable.
              Fields of expertise accepted: AI/ML, AI Safety, CS, Math,
              Philosophy, Psychological sciences, Social sciences, Natural
              sciences, Health sciences, Animal advocacy, Business, Law, Policy.
            sections:
              - name: "Engagement with Digital Minds"
                mustAnswer:
                  - "Please describe your engagement with the digital minds field. This might include what you have read, your personal views and predictions about digital minds, and any original thinking or proposals you have developed. If applicable, please share any relevant outputs or activities, such as links to academic papers, blog posts, or details of conferences you have attended."
                targetWords: 300
              - name: "Career Plans & Fellowship Impact"
                mustAnswer:
                  - "What are your current career plans, and how do you hope this fellowship will accelerate your journey to contribute to the field of digital minds? Please describe your current career direction, even if it is tentative or evolving. What paths are you considering, and what uncertainties or trade-offs are you navigating?"
                targetWords: 200
              - name: "Focus Areas (Interest Ratings)"
                question: "Please rate your interest in each of the following areas in relation to digital minds on a scale of 1 to 5: Philosophical, Policy, Societal Impacts, Technical."
              - name: "Fields of Expertise"
                question: "Select up to 4 fields of expertise including past or present studies or work: AI/ML, AI Safety, CS, Mathematics, Philosophy, Psychological sciences, Social sciences, Natural sciences, Health sciences, Animal advocacy, Business, Law, Politics/Policy, Other."
              - name: "Availability Confirmation"
                question: "Are you available to come to Cambridge for the full programme? The full programme consists of the Fellowship from the 3rd to the 7th of August and the Strategy Workshop with experts on the 8th and 9th."
              - name: "Online Course Interest"
                question: "Would you like to take part in the Introduction to Digital Minds online course this Spring? The course starts at the end of April and is 8-weeks long (2 hours reading + 1.5-hour group discussion each week, no fees)."
              - name: "Additional Comments"
                question: "Anything else you would like to mention? For example, questions, comments, or feedback about the programme content or format."
            evaluationCriteria:
              - "Credible engagement with digital minds literature and field"
              - "Genuine motivation to explore AI consciousness/welfare questions"
              - "Relevant expertise from any discipline (philosophy, CS, neuroscience, policy, health, etc.)"
              - "Curiosity and independent thinking (prior digital minds experience not required)"
              - "Diversity of perspective and background"
              - "Clear career direction and articulation of how fellowship accelerates it"
              - "Availability for full 7-day residential programme in Cambridge"

  # Step 2: Run the full orchestrator pipeline
  - id: CAT2-RUN
    type: orchestrator_e2e
    action: run
    proposalCategory: fellowship
    body:
      opportunityId: "eval-cat2-digital-minds-2026"
    orchestratorOptions:
      focusGeography: "Bihar, India (Patna, Bihta, Sarairanjan) — applying as individual fellow"
      targetGroup: "AI systems, digital minds, consciousness research"
    categoryExpectations:
      min_fit_score: 20
      cross_section_threshold: 0.55
      category_threshold: 0.65
      min_sections: 6
    expectations:
      expect_keys: ["proposalRunId"]

  # Step 3: Retrieve the full proposal run
  - id: CAT2-GET-RUN
    type: proposal_generate
    action: get_run
    params:
      runId: "$ref:CAT2-RUN.proposalRunId"

  # Step 4: Check gaps
  - id: CAT2-GAPS
    type: proposal_generate
    action: get_gaps
    params:
      runId: "$ref:CAT2-RUN.proposalRunId"

  # ── Ashoka Changemaker Fellowship 2026 ──────────────────────────────────────

  - id: CAT2-ASHOKA-SETUP
    type: opportunity_intake
    action: create
    body:
      opportunityId: "eval-cat2-ashoka-changemaker-2026"
      jsonBlob:
        schemaVersion: "1.0"
        opportunity:
          opportunityId: "eval-cat2-ashoka-changemaker-2026"
          sourceType: "manual"
          source:
            from:
              name: "Ashoka Innovators for the Public"
              email: "fellowships@ashoka.org"
            to:
              - "gautamgauri@dikshafoundation.org"
            subject: "Ashoka Changemaker Fellowship 2026 — Applications Open"
            threadId: "eval-cat2-ashoka-thread"
            receivedAt: "2026-02-20T00:00:00+05:30"
            attachments: []
            emailMessageId: "eval-cat2-ashoka-manual"
          funder:
            name: "Ashoka Innovators for the Public"
            funderType: "Social Enterprise Network"
            programName: "Ashoka Changemaker Fellowship 2026"
          themes:
            primary:
              - "social entrepreneurship"
              - "education innovation"
              - "systems change"
            secondary:
              - "youth development"
              - "leadership"
              - "community-driven change"
              - "scale and replication"
          internal:
            org: "Gautam Gauri (personal fellowship)"
            owner:
              name: "Gautam Gauri"
              role: "Founder & Executive Director"
              email: "gautamgauri@dikshafoundation.org"
            priority: "high"
          docTypeCategory: "fellowship"
          keyConstraints:
            deadline: "2026-05-15T23:59:00+00:00"
            geography:
              - "Global"
              - "South Asia"
            projectDurationMonthsMax: 12
          extractedRequirements:
            summary: >
              The Ashoka Changemaker Fellowship selects social entrepreneurs who
              have demonstrated a pattern of systems-level change in their field.
              Fellows join a lifelong peer network, receive a living stipend for
              3 years, and gain access to Ashoka's global infrastructure. The
              application asks for personal narrative essays covering motivation,
              leadership journey, contribution to community, and future direction.
              Prior Ashoka affiliation not required. Writing should be personal
              and reflective, not organizational.
            sections:
              - name: "Motivation & Origin Story"
                mustAnswer:
                  - "What motivated you to start your work? Describe the personal experience or moment that set you on this path. What problem did you see, and why did you feel compelled to act?"
                targetWords: 300
              - name: "Leadership Journey"
                mustAnswer:
                  - "Describe your leadership journey so far. What key decisions, risks, or turning points have shaped your approach? How has your thinking about change evolved over time?"
                targetWords: 400
              - name: "Contribution to Fellowship Community"
                mustAnswer:
                  - "What would you contribute to a cohort of social entrepreneurs? What unique perspective, skill, or experience do you bring that would enrich the fellowship community?"
                targetWords: 200
              - name: "Career Direction & Fellowship Impact"
                mustAnswer:
                  - "Where do you see yourself in 5 years? How would this fellowship accelerate your trajectory? What specific capabilities or connections would you develop?"
                targetWords: 300
              - name: "Research & Learning Agenda"
                mustAnswer:
                  - "What question or challenge are you currently grappling with? What would you want to study, explore, or prototype during the fellowship period?"
                targetWords: 200
              - name: "Engagement with Systems Change"
                mustAnswer:
                  - "Describe a specific instance where your work created change beyond the direct beneficiaries — influencing policy, shifting norms, or inspiring replication. What made this possible?"
                targetWords: 300
            evaluationCriteria:
              - "Demonstrated pattern of social entrepreneurship"
              - "Evidence of systems-level thinking and action"
              - "Personal authenticity and reflective capacity"
              - "Clear vision for scaling or deepening impact"
              - "Potential contribution to peer learning community"
              - "Track record of leadership through adversity"

  - id: CAT2-ASHOKA-RUN
    type: orchestrator_e2e
    action: run
    proposalCategory: fellowship
    body:
      opportunityId: "eval-cat2-ashoka-changemaker-2026"
    orchestratorOptions:
      focusGeography: "Bihar, India (Patna, Bihta, Sarairanjan) — applying as individual fellow"
      targetGroup: "social entrepreneurship, education innovation, youth development"
    categoryExpectations:
      min_fit_score: 30
      cross_section_threshold: 0.55
      category_threshold: 0.65
      min_sections: 5
    expectations:
      expect_keys: ["proposalRunId"]

  - id: CAT2-ASHOKA-GET-RUN
    type: proposal_generate
    action: get_run
    params:
      runId: "$ref:CAT2-ASHOKA-RUN.proposalRunId"

  - id: CAT2-ASHOKA-GAPS
    type: proposal_generate
    action: get_gaps
    params:
      runId: "$ref:CAT2-ASHOKA-RUN.proposalRunId"

  # ── Wellcome Global Health Leaders 2026 ─────────────────────────────────────

  - id: CAT2-WELLCOME-SETUP
    type: opportunity_intake
    action: create
    body:
      opportunityId: "eval-cat2-wellcome-health-2026"
      jsonBlob:
        schemaVersion: "1.0"
        opportunity:
          opportunityId: "eval-cat2-wellcome-health-2026"
          sourceType: "manual"
          source:
            from:
              name: "Wellcome Trust"
              email: "fellowships@wellcome.org"
            to:
              - "gautamgauri@dikshafoundation.org"
            subject: "Wellcome Global Health Leaders 2026 — Call for Applications"
            threadId: "eval-cat2-wellcome-thread"
            receivedAt: "2026-02-25T00:00:00+05:30"
            attachments: []
            emailMessageId: "eval-cat2-wellcome-manual"
          funder:
            name: "Wellcome Trust"
            funderType: "Global Health Foundation"
            programName: "Global Health Leaders Fellowship 2026"
          themes:
            primary:
              - "global health equity"
              - "cancer screening"
              - "community health navigation"
            secondary:
              - "health tech"
              - "patient navigation"
              - "low-resource health systems"
              - "digital health"
          internal:
            org: "Gautam Gauri (personal fellowship — SCCF/career)"
            owner:
              name: "Gautam Gauri"
              role: "Founder & Executive Director"
              email: "gautamgauri@dikshafoundation.org"
            priority: "high"
          docTypeCategory: "fellowship"
          keyConstraints:
            deadline: "2026-06-01T23:59:00+00:00"
            geography:
              - "Global"
              - "South Asia"
              - "Low- and middle-income countries"
            projectDurationMonthsMax: 24
          extractedRequirements:
            summary: >
              The Wellcome Global Health Leaders Fellowship supports emerging
              leaders working at the intersection of health equity and innovation.
              Fellows receive a 2-year stipend, mentorship, and access to
              Wellcome's global network. The application focuses on personal
              motivation for health equity work, career trajectory, a research
              or learning question, and leadership in complex health systems.
              Writing should be personal and reflective. Prior Wellcome funding
              not required.
            sections:
              - name: "Motivation for Health Equity Work"
                mustAnswer:
                  - "What drives your commitment to health equity? Describe the personal experience, observation, or turning point that led you to focus on improving health outcomes for underserved communities."
                targetWords: 300
              - name: "Career Plans & Fellowship Acceleration"
                mustAnswer:
                  - "Where is your career heading, and how would this fellowship accelerate your impact? What specific skills, knowledge, or networks would you develop during the fellowship period?"
                targetWords: 200
              - name: "Research Question or Learning Agenda"
                mustAnswer:
                  - "What is the central question or challenge you want to investigate during this fellowship? Describe your approach — what would you study, build, or test, and why does this matter for health equity?"
                targetWords: 400
              - name: "Leadership in Complex Health Systems"
                mustAnswer:
                  - "Describe a specific situation where you navigated complexity in a health system — bureaucracy, resource constraints, cultural barriers, or multi-stakeholder coordination. What did you learn about leadership from this experience?"
                targetWords: 300
              - name: "Contribution to Fellow Cohort"
                mustAnswer:
                  - "What unique perspective or capability would you bring to a diverse cohort of global health leaders? How would you contribute to peer learning and collective problem-solving?"
                targetWords: 200
            evaluationCriteria:
              - "Demonstrated commitment to health equity in underserved settings"
              - "Evidence of leadership in complex health systems"
              - "Clear and compelling research or learning question"
              - "Personal authenticity and reflective depth"
              - "Potential to contribute to peer learning community"
              - "Track record of navigating resource-constrained environments"

  - id: CAT2-WELLCOME-RUN
    type: orchestrator_e2e
    action: run
    proposalCategory: fellowship
    body:
      opportunityId: "eval-cat2-wellcome-health-2026"
    orchestratorOptions:
      focusGeography: "Bihar, India — applying as individual fellow (SCCF/cancer care)"
      targetGroup: "global health equity, cancer screening, community health navigation"
    categoryExpectations:
      min_fit_score: 25
      cross_section_threshold: 0.55
      category_threshold: 0.65
      min_sections: 4
    expectations:
      expect_keys: ["proposalRunId"]

  - id: CAT2-WELLCOME-GET-RUN
    type: proposal_generate
    action: get_run
    params:
      runId: "$ref:CAT2-WELLCOME-RUN.proposalRunId"

  - id: CAT2-WELLCOME-GAPS
    type: proposal_generate
    action: get_gaps
    params:
      runId: "$ref:CAT2-WELLCOME-RUN.proposalRunId"
