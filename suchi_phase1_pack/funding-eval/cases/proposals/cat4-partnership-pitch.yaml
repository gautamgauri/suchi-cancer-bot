# Category 4: Partnership Pitch — Naandi "Sports for Life" alliance → Diksha
# Tests: orchestrator pipeline for a non-RFP partnership pitch
# Real opportunity: Naandi Foundation — India's largest sports-based development program
# Sports for Life: 130K-180K girls across 14 states, 1700 Skills Associates
# Naandi has: nutrition (Nanhi Kali), life skills, scale (14 states), corporate donors
# Diksha has: KHEL methodology, SEL, Bihar government school relationships, sports pedagogy
# Output: 3 documents — warm email + concept note + pilot design one-pager
# Run: npx tsx cli.ts proposal-suite --api-url http://localhost:3001 --category partnership_pitch --verbose

cases:
  # Step 1: Create the opportunity
  - id: CAT4-SETUP
    type: opportunity_intake
    action: create
    body:
      opportunityId: "eval-cat4-naandi-sports-2026-v2"
      jsonBlob:
        schemaVersion: "1.0"
        opportunity:
          opportunityId: "eval-cat4-naandi-sports-2026-v2"
          sourceType: "manual"
          source:
            from:
              name: "Naandi Foundation"
              email: "info@naandi.org"
            to:
              - "gautamgauri@dikshafoundation.org"
            subject: "Partnership Opportunity — Naandi Sports for Life × Diksha KHEL"
            threadId: "eval-cat4-thread"
            receivedAt: "2026-03-01T00:00:00+05:30"
            attachments: []
            emailMessageId: "eval-cat4-manual"
          funder:
            name: "Naandi Foundation"
            funderType: "NGO Partner"
            programName: "Sports for Life Alliance"
          themes:
            primary:
              - "sports-based holistic development"
              - "strategic partnership"
            secondary:
              - "nutrition and health"
              - "life skills and SEL"
              - "government school partnerships"
              - "girls' empowerment"
              - "Bihar"
              - "Telangana"
          internal:
            org: "Diksha Foundation"
            owner:
              name: "Gautam Gauri"
              role: "Executive Director"
              email: "gautamgauri@dikshafoundation.org"
            priority: "high"
          docTypeCategory: "partnership_pitch"
          keyConstraints:
            deadline: "2026-07-15T23:59:00+05:30"
            geography:
              - "India"
              - "Bihar"
              - "Telangana"
            projectDurationMonthsMax: 30
          extractedRequirements:
            summary: >
              Naandi Foundation runs India's largest sports-based development program
              "Sports for Life" — reaching 130,000-180,000 girls across 14 states
              with 1,700 Skills Associates. Program combines sports coaching with
              life skills, nutrition, and menstrual health education. Founded by
              Manoj Kumar (CEO) and K. Anji Reddy (founder, Dr. Reddy's Labs).
              Naandi also runs Nanhi Kali (girls' education, 150K+ beneficiaries),
              agriculture programs, and has CSR partnerships with Mahindra, Axis Bank,
              and Dr. Reddy's. Partnership rationale: Naandi brings scale (14 states),
              nutrition expertise, corporate donor network, and girls' empowerment
              focus. Diksha brings KHEL sports pedagogy, social-emotional learning
              methodology, Bihar government school relationships, and holistic
              education model. Joint value: combine Diksha's deep sports pedagogy
              with Naandi's scale, add Bihar as a new state for Sports for Life,
              create a replicable model for sports + SEL + nutrition in government
              schools. Not a traditional grant — requires a warm approach email,
              concept note, and pilot design one-pager.
            sections:
              - name: "Warm Introduction Email"
                question: "Draft a concise, compelling email from Gautam Gauri to Naandi's leadership introducing Diksha Foundation and proposing a partnership exploration meeting. Reference specific Naandi programs (Sports for Life, Toofaan Games) to show homework done."
              - name: "Partnership Rationale"
                question: "Why should Naandi partner with Diksha? What gap does Diksha fill that Naandi cannot do alone? How does this align with Naandi's stated mission and growth trajectory?"
              - name: "Mutual Value Proposition"
                question: "What does each partner bring? Naandi: scale (14 states, 1700 Skills Associates), nutrition, corporate donors. Diksha: KHEL methodology, SEL, Bihar relationships, sports pedagogy depth."
              - name: "Concept Note"
                question: "2-3 page concept note for a joint 'Sports + SEL + Nutrition' program in Bihar government schools. Include problem statement, proposed model, target beneficiaries, theory of change, and expected outcomes."
              - name: "Pilot Design"
                question: "One-page pilot design: 6-month joint pilot in 5-10 Bihar government schools. Roles and responsibilities, shared M&E framework, budget split, success metrics, decision criteria for scale-up."
              - name: "Operating Model"
                question: "How would the partnership operate day-to-day? Staff sharing, training, reporting lines, IP ownership, branding, communication protocols."
              - name: "Budget Framework"
                question: "High-level budget for the pilot phase. Diksha contribution vs. Naandi contribution vs. joint fundraising target. Cost per beneficiary benchmark."
              - name: "Next Steps & Timeline"
                question: "Concrete next steps: introductory call, MOU signing, pilot launch, review checkpoints. 6-month timeline with milestones."
            evaluationCriteria:
              - "Complementary capabilities clearly articulated (not overlapping)"
              - "Mutual value creation — both partners gain something they cannot build alone"
              - "Feasible operating model with clear roles and responsibilities"
              - "Credible tone — peer-to-peer, not supplicant; shows homework on Naandi's work"
              - "Specific pilot design with measurable success criteria"
              - "Clear next steps that are actionable within 30 days"
              - "References to Naandi's actual programs (Sports for Life, Toofaan Games, Nanhi Kali)"

  # Step 2: Run the full orchestrator pipeline
  - id: CAT4-RUN
    type: orchestrator_e2e
    action: run
    proposalCategory: partnership_pitch
    body:
      opportunityId: "eval-cat4-naandi-sports-2026-v2"
    orchestratorOptions:
      focusGeography: "Bihar (Patna, Bihta, Sarairanjan) and Telangana"
      targetGroup: "children aged 6-14, especially girls, in government schools"
    expectedOutputs:
      - concept_note
      - pitch_email
      - pilot_design
    categoryExpectations:
      min_fit_score: 25
      cross_section_threshold: 0.35
      category_threshold: 0.30
      min_sections: 4
    expectations:
      expect_keys: ["proposalRunId"]

  # Step 3: Retrieve the full proposal run
  - id: CAT4-GET-RUN
    type: proposal_generate
    action: get_run
    params:
      runId: "$ref:CAT4-RUN.proposalRunId"

  # Step 4: Check gaps
  - id: CAT4-GAPS
    type: proposal_generate
    action: get_gaps
    params:
      runId: "$ref:CAT4-RUN.proposalRunId"
