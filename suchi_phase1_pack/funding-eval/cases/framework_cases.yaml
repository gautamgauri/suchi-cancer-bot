# Framework card retrieval - FW-01 through FW-04
# Run: npx tsx cli.ts run --api-url http://localhost:3001 --cases cases/framework_cases.yaml --summary

cases:
  - id: FW-01
    type: framework_retrieve
    action: retrieve
    body:
      capabilities:
        - "C1"
        - "C2"
      cardTypes:
        - method
        - pattern
      limit: 5

  - id: FW-02
    type: framework_retrieve
    action: recommend_methods
    body:
      ageBand: "6-14"
      setting: "school"
      capabilities: "C1,C2"

  - id: FW-03
    type: framework_retrieve
    action: check_consistency
    body:
      # ConsistencyCheckInputDto: draftText (required), claimedCapabilities (required), projectId (optional)
      draftText: "Our program delivers teacher training in rural schools to improve literacy and numeracy outcomes."
      claimedCapabilities:
        - "C1"
        - "C2"

  - id: FW-04
    type: framework_retrieve
    action: generate_mel_pack
    body:
      # MelPackInputDto: capabilities (required), targetGroup (required), projectId (optional)
      capabilities:
        - "C1"
        - "C2"
      targetGroup: "children"
