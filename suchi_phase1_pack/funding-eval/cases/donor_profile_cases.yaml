# Donor profile generation - DONOR-01 through DONOR-03
# Run: npx tsx cli.ts run --api-url http://localhost:3001 --cases cases/donor_profile_cases.yaml --summary

cases:
  - id: DONOR-01
    type: donor_profile
    body:
      orgName: "Gates Foundation"
      urls:
        - "https://www.gatesfoundation.org/about"
    expectations:
      expect_keys: ["profile", "evidenceGaps"]

  - id: DONOR-02
    type: donor_profile
    body:
      orgName: "Eval Test Funder"
      notes: "No URLs provided."
    expectations:
      expect_keys: ["profile", "evidenceGaps"]

  - id: DONOR-03
    type: donor_profile
    body:
      orgName: "Example Foundation"
      chunks:
        - content: "Focus on education and health in South Asia."
          title: "Annual Report 2023"
    expectations:
      expect_keys: ["profile", "evidenceGaps"]
