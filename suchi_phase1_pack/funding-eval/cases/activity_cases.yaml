# Activity logging - ACT-01 through ACT-04 (BRD Auditability)
# Depends on pipeline entry; creates one first (ACT-SETUP).
# Run: npx tsx cli.ts run --api-url http://localhost:3001 --cases cases/activity_cases.yaml --summary

cases:
  - id: ACT-SETUP
    type: pipeline_crud
    action: create
    body:
      orgName: "Activity Eval Org"
      stage: "lead"
      notes: "For activity eval"

  - id: ACT-01
    type: activity_log
    action: log_with_createdBy
    body:
      orgId: "$ref:ACT-SETUP.id"
      type: "note"
      notes: "Eval activity with attribution"
      createdBy: "eval-runner"
    expectations:
      expect_createdBy: true

  - id: ACT-02
    type: activity_log
    action: log
    body:
      orgId: "$ref:ACT-SETUP.id"
      type: "meeting"
      notes: "No createdBy"

  - id: ACT-03
    type: activity_log
    action: require_donor_or_org
    expectations:
      expect_error: true

  - id: ACT-04
    type: activity_log
    action: get_activities
    params:
      entryId: "$ref:ACT-SETUP.id"
    expectations:
      expect_array: true
