name: Landing Check

# Builds and verifies the landing site on pull requests, so a failure shows
# before merge. It runs the same checks as deploy-landing.yml and deploys
# nothing.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "scripts/check_image_assets.py"
      - ".github/workflows/landing-check.yml"
      - ".github/workflows/deploy-landing.yml"

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - name: Public image assets have real image magic bytes (issue #140)
        run: python3 scripts/check_image_assets.py

      - name: Install dependencies
        run: npm ci
        working-directory: apps/landing

      - name: Build landing site
        run: npm run build
        working-directory: apps/landing

      - name: Verify built site
        run: npm run verify
        working-directory: apps/landing
