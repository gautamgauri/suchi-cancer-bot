name: Funding Eval (Cloud SQL + Deepseek LLM)

on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run full LLM suite (costs tokens)'
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths:
      - "suchi_phase1_pack/apps/funding-api/**"
      - "suchi_phase1_pack/funding-eval/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      PORT: "3001"
      # LLM: Deepseek for cheap generation
      FUNDING_OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FUNDING_OPENAI_BASE_URL: "https://api.deepseek.com/v1"
      FUNDING_LLM_MODEL: "deepseek-chat"
      # Embeddings: Google Gemini (same provider as production)
      FUNDING_EMBEDDING_PROVIDER: "google"
      FUNDING_EMBEDDINGS_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EVIDENCE_EMBEDDING_MODEL: "text-embedding-004"
      # Database
      DATABASE_URL: postgresql://${{ secrets.CLOUDSQL_DB_USER }}:${{ secrets.CLOUDSQL_DB_PASSWORD }}@127.0.0.1:5432/funding_ci
      FUNDING_DATABASE_URL: postgresql://${{ secrets.CLOUDSQL_DB_USER }}:${{ secrets.CLOUDSQL_DB_PASSWORD }}@127.0.0.1:5432/funding_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            suchi_phase1_pack/apps/funding-api/package-lock.json
            suchi_phase1_pack/funding-eval/package-lock.json

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.12.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${{ secrets.CLOUDSQL_INSTANCE_CONNECTION_NAME }}" --port 5432 &
          # Wait for proxy to be ready (up to 60s)
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
              echo "Cloud SQL proxy is ready"
              break
            fi
            echo "Waiting for Cloud SQL proxy... ($i/30)"
            sleep 2
          done

      - name: Install deps (funding-api)
        working-directory: suchi_phase1_pack/apps/funding-api
        run: npm ci

      - name: Install deps (funding-eval)
        working-directory: suchi_phase1_pack/funding-eval
        run: npm ci

      - name: Migrate DB
        working-directory: suchi_phase1_pack/apps/funding-api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Build funding-api
        working-directory: suchi_phase1_pack/apps/funding-api
        run: npm run build

      - name: Start funding-api
        working-directory: suchi_phase1_pack/apps/funding-api
        run: |
          nohup npm run start > funding-api.log 2>&1 &
          echo "funding-api started"

      - name: Wait for API
        run: |
          for i in {1..90}; do
            if curl -fsS "http://localhost:3001/ready" >/dev/null 2>&1; then
              echo "API ready (DB connected)"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready"
          tail -n 200 suchi_phase1_pack/apps/funding-api/funding-api.log || true
          exit 1

      # On push: run CRUD-only (cheap, no LLM tokens)
      # On manual dispatch with full_suite=true: run full batch (LLM costs tokens)
      - name: Seed test data
        working-directory: suchi_phase1_pack/apps/funding-api
        run: npx tsx src/scripts/seed-eval-data.ts

      - name: Run eval (CRUD-only)
        if: ${{ github.event_name == 'push' || inputs.full_suite != true }}
        working-directory: suchi_phase1_pack/funding-eval
        run: |
          echo "Running CRUD-only eval (no LLM costs)"
          npx tsx cli.ts run --api-url http://localhost:3001 \
            --cases cases/pipeline_cases.yaml \
            --output funding-eval-report.json \
            --summary \
            --fail-on-regression

      - name: Run eval (full suite with LLM)
        if: ${{ inputs.full_suite == true }}
        working-directory: suchi_phase1_pack/funding-eval
        run: |
          echo "Running full eval suite (LLM costs tokens)"
          npx tsx cli.ts run --api-url http://localhost:3001 \
            --batch \
            --output funding-eval-report.json \
            --summary \
            --fail-on-regression

      - name: Upload report + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-eval-report
          path: |
            suchi_phase1_pack/funding-eval/funding-eval-report.json
            suchi_phase1_pack/apps/funding-api/funding-api.log
          retention-days: 30
