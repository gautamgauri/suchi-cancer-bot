# API build verification — this workflow does NOT deploy.
#
# Cloud Build (cloudbuild.yaml) is the SINGLE deployment authority for
# suchi-api. Deploys are a human decision, run manually:
#     gcloud builds submit --config cloudbuild.yaml .
# (then promote the new revision to traffic — see docs/OPERATIONS_RUNBOOK.md).
#
# History: this workflow used to auto-deploy on push to main with its own
# copy of the Cloud Run env/secret config. Because --set-env-vars/--set-secrets
# REPLACE the full set (no merge), its stale copy wiped production config on
# 2026-06-28 (see PR #51). It now verifies that the API unit suite passes, that
# the image builds, and that the two Cloud Build pipelines carry identical
# runtime config.
#
# The `test` job below is the repo's only automated gate on API behavior. Before
# it existed the apps/api Jest suite ran in no workflow at all: the specs were
# written and passing locally, but nothing enforced them on a PR or on main, so
# a behavioral regression could reach a manual Cloud Build deploy unchallenged.
name: API build verification

# Deliberately NOT path-filtered. Both jobs below are required status checks on
# main, and GitHub blocks a PR forever on "Expected - waiting for status" when a
# required check is filtered out of that PR. A docs- or eval-only PR would never
# become mergeable. The whole workflow runs in about a minute, so it runs on
# everything rather than being conditionally skipped.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      # The Prisma client is generated, not committed, and prisma.service.ts
      # imports it — ts-jest cannot compile the suite without this. Reads the
      # schema only; no database connection is involved.
      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run Jest
        working-directory: apps/api
        run: npm run test:ci

  verify:
    name: Build + config parity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: No credential-shaped literals in tracked files (issue #127)
        run: python3 scripts/check_no_secret_literals.py

      - name: Check deploy pipeline config parity
        run: python3 scripts/check_deploy_config_parity.py

      - name: Public image assets have real image magic bytes (issue #140)
        run: python3 scripts/check_image_assets.py

      # The LinkedIn OAuth helper lives in scripts/, which no jest project
      # reaches (apps/api/jest.config.js roots at apps/api/src), so its pure
      # helpers - argument parsing, token-destination resolution, redaction,
      # the org/role table - carry their own checks. They assert, among other
      # things, that the exchange summary never contains the token value.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: LinkedIn OAuth helper self-test
        run: npm run linkedin:auth:self-test

      - name: Build API image (verification only, not pushed)
        run: |
          docker build \
            -t suchi-api:verify-${{ github.sha }} \
            -f apps/api/Dockerfile \
            apps/api
