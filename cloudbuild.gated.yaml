# Google Cloud Build configuration with gated deployment
# Deploys candidate revision → health-checks it → shifts traffic only if healthy
# Eval gate removed — use the /eval slash command locally before merging instead

steps:
  # 1) Build API Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    dir: 'apps/api'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/suchi-api:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/suchi-api:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2) Push API image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/suchi-api'

  # 2b) Update migration job to use the just-built image
  # NOTE: Update MIG to the latest migration name whenever a new migration is added.
  # MIG is only used in the repair/fallback path — prisma migrate deploy (step 1 of the
  # script) handles all pending migrations regardless. See docs/cloudbuild-gated-issues.md.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-migrate-job-image'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'suchi-db-migrate'
      - '--region=${_REGION}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/suchi-api:$BUILD_ID'
      - '--set-cloudsql-instances=${_CLOUDSQL_CONNECTION_NAME}'
      - '--set-secrets=DATABASE_URL=database-url:latest'
      - '--set-env-vars=NODE_ENV=production,MIG=20260606000000_phase2_user_role_review_kb_metadata'
      - '--command=/app/scripts/migrate-with-repair.sh'
      - '--max-retries=1'
      - '--parallelism=1'
      - '--tasks=1'
    waitFor: ['push-api']

  # 2c) Validate Prisma schema syntax (no DB access needed)
  - name: 'node:20'
    id: 'check-schema-local'
    dir: 'apps/api'
    entrypoint: 'bash'
    args:
      - '-euc'
      - |
        npm ci --quiet
        npx prisma@5.22.0 validate
        echo "✅ Prisma schema is valid"
    waitFor: ['push-api']

  # 2d) Execute migration job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'run-migrations'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'suchi-db-migrate'
      - '--region=${_REGION}'
      - '--wait'
    waitFor: ['update-migrate-job-image', 'check-schema-local']

  # 3) Deploy candidate revision with 0% traffic (tagged 'candidate')
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-candidate'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_API_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/suchi-api:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'
      - '--tag'
      - 'candidate'
      - '--no-traffic'
      - '--add-cloudsql-instances'
      - '${_CLOUDSQL_CONNECTION_NAME}'
      - '--set-env-vars'
      - 'NODE_ENV=production,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},EMBEDDING_MODEL=gemini-embedding-001,RATE_LIMIT_TTL_SEC=60,RATE_LIMIT_REQ_PER_TTL=20,LLM_PROVIDER=gemini,LLM_TIMEOUT_MS=45000,GCS_BUCKET_TTS=suchi-tts-audio,SCHEDULER_OIDC_AUDIENCE=https://suchi-api-lxiveognla-uc.a.run.app,SCHEDULER_SA_EMAIL=suchi-scheduler@gen-lang-client-0202543132.iam.gserviceaccount.com,DAILY_REPORT_EMAIL=gautamgauri@dikshafoundation.org,SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,SMTP_USER=gautamgauri@dikshafoundation.org,LANGFUSE_ENABLED=true,LANGFUSE_HOST=https://us.cloud.langfuse.com,QUEUE_GCS_BUCKET=suchi-navigator-state,SUCHI_SITE_URL=https://suchicancercare.org,SUCHI_SOCIAL_CARD_URL=https://storage.googleapis.com/suchi-public-assets/suchi_social_card.png'
      - '--set-secrets'
      - 'DATABASE_URL=database-url:latest,DEEPSEEK_API_KEY=deepseek-api-key:latest,EMBEDDING_API_KEY=embedding-api-key:latest,ADMIN_BASIC_USER=admin-basic-user:latest,ADMIN_BASIC_PASS=admin-basic-pass:latest,SMTP_PASS=SMTP_PASS:latest,LANGFUSE_PUBLIC_KEY=langfuse-public-key:latest,LANGFUSE_SECRET_KEY=langfuse-secret-key:latest,NAVIGATOR_APPROVAL_SECRET=NAVIGATOR_APPROVAL_SECRET:latest,CONTENT_APPROVAL_SECRET=CONTENT_APPROVAL_SECRET:latest,META_PAGE_ACCESS_TOKEN=META_PAGE_ACCESS_TOKEN:latest,META_PAGE_ID=META_PAGE_ID:latest,META_IG_USER_ID=META_IG_USER_ID:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,DISTRIBUTION_APPROVAL_SECRET=DISTRIBUTION_APPROVAL_SECRET:latest,META_WABA_PHONE_NUMBER_ID=META_WABA_PHONE_NUMBER_ID:latest,META_WABA_TOKEN=META_WABA_TOKEN:latest,META_APP_SECRET=META_APP_SECRET:latest,WHATSAPP_VERIFY_TOKEN=WHATSAPP_VERIFY_TOKEN:latest'
      - '--quiet'

  # 4) Health-check the candidate revision before promoting
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'healthcheck-candidate'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        echo "Waiting for candidate revision to be healthy..."
        revision_name=$(gcloud run revisions list --service=${_API_SERVICE_NAME} --region=${_REGION} --limit=1 --format='value(name)')
        echo "Latest revision: $revision_name"
        echo "$revision_name" > /workspace/candidate-revision.txt

        service_url=$(gcloud run services describe ${_API_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
        service_domain=$(echo "$service_url" | sed 's|https://||')
        candidate_url="https://candidate---$service_domain"
        health_url="$candidate_url/v1/health"
        echo "Checking health at: $health_url"

        for i in $(seq 1 60); do
          if curl -fsS "$health_url" >/dev/null 2>&1; then
            echo "✅ Candidate revision is healthy"
            exit 0
          fi
          echo "Attempt $i/60: waiting..."
          sleep 5
        done
        echo "❌ Candidate never became healthy after 5 minutes"
        exit 1

  # 5) Shift 100% traffic to candidate
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'promote-candidate'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        candidate_revision=$(cat /workspace/candidate-revision.txt)
        echo "Promoting revision: $candidate_revision"
        gcloud run services update-traffic ${_API_SERVICE_NAME} \
          --region=${_REGION} \
          --to-revisions="$candidate_revision=100" \
          --quiet
        echo "✅ Traffic shifted to $candidate_revision"
    waitFor: ['healthcheck-candidate']

  # 6) Build Web Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-web'
    dir: 'apps/web'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/suchi-web:$BUILD_ID'
      - '--build-arg'
      - 'VITE_API_URL=${_API_URL}'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 7) Push Web image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-web'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/suchi-web:$BUILD_ID'

  # 8) Deploy Web to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_WEB_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/suchi-web:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'VITE_API_URL=${_API_URL}'
    waitFor: ['promote-candidate']

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REGISTRY: 'suchi-images'
  _API_SERVICE_NAME: 'suchi-api'
  _WEB_SERVICE_NAME: 'suchi-web'
  _CLOUDSQL_CONNECTION_NAME: 'gen-lang-client-0202543132:us-central1:suchi-db'
  _API_URL: 'https://suchi-api-lxiveognla-uc.a.run.app/v1'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: 'CLOUD_LOGGING_ONLY'

timeout: '900s'  # 15 minutes: build+push (~8m) + migrate (~2m) + deploy+healthcheck (~3m) + web (~2m)
