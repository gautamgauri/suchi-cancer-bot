# Google Cloud Build configuration for Suchi Cancer Bot
# This file defines the build and deployment pipeline
#
# NOTE: Uses $BUILD_ID (not SHORT_SHA) for image tags because BUILD_ID is always
# available, while SHORT_SHA is only available for repository-triggered builds.
# This allows both manual (gcloud builds submit) and trigger-based deployments.

steps:
  # hospitals.json is committed at apps/api/data/hospitals.json (canonical source).
  # This step syncs from apps/landing/src/content/ when present (keeps both in sync),
  # and falls back gracefully when the landing app is excluded from the build tarball.
  - name: 'ubuntu'
    id: 'stage-hospitals'
    args: ['bash', '-c', 'mkdir -p apps/api/data && if [ -f apps/landing/src/content/hospitals.json ]; then cp apps/landing/src/content/hospitals.json apps/api/data/hospitals.json && echo "Synced hospitals.json from landing app"; else echo "hospitals.json already present at apps/api/data/hospitals.json (committed copy)"; fi && ls -la apps/api/data/hospitals.json']

  # Build API Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    waitFor: ['stage-hospitals']
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/suchi-api:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/suchi-api:latest'
      - '-f'
      - 'apps/api/Dockerfile'
      - 'apps/api'

  # Build Web Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-web'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/suchi-web:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/suchi-web:latest'
      - '--build-arg'
      - 'VITE_API_URL=${_API_URL}'
      - '-f'
      - 'apps/web/Dockerfile'
      - 'apps/web'

  # Push API image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/suchi-api'

  # Push Web image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-web'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/suchi-web'

  # Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_API_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/suchi-api:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'
      - '--add-cloudsql-instances'
      - '${_CLOUDSQL_CONNECTION_NAME}'
      - '--set-env-vars'
      - 'NODE_ENV=production,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},EMBEDDING_MODEL=gemini-embedding-001,RATE_LIMIT_TTL_SEC=60,RATE_LIMIT_REQ_PER_TTL=20,LLM_PROVIDER=gemini,LLM_TIMEOUT_MS=45000,GCS_BUCKET_TTS=suchi-tts-audio,SCHEDULER_OIDC_AUDIENCE=https://suchi-api-lxiveognla-uc.a.run.app,SCHEDULER_SA_EMAIL=suchi-scheduler@gen-lang-client-0202543132.iam.gserviceaccount.com,DAILY_REPORT_EMAIL=gautamgauri@dikshafoundation.org,SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,SMTP_USER=gautamgauri@dikshafoundation.org,LANGFUSE_ENABLED=true,LANGFUSE_HOST=https://us.cloud.langfuse.com,QUEUE_GCS_BUCKET=suchi-navigator-state'
      - '--set-secrets'
      - 'DATABASE_URL=database-url:latest,DEEPSEEK_API_KEY=deepseek-api-key:latest,EMBEDDING_API_KEY=embedding-api-key:latest,ADMIN_BASIC_USER=admin-basic-user:latest,ADMIN_BASIC_PASS=admin-basic-pass:latest,SMTP_PASS=SMTP_PASS:latest,LANGFUSE_PUBLIC_KEY=langfuse-public-key:latest,LANGFUSE_SECRET_KEY=langfuse-secret-key:latest,NAVIGATOR_APPROVAL_SECRET=NAVIGATOR_APPROVAL_SECRET:latest,CONTENT_APPROVAL_SECRET=CONTENT_APPROVAL_SECRET:latest'

  # Deploy Web to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_WEB_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/suchi-web:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'VITE_API_URL=${_API_URL}'

# Substitution variables (set these in Cloud Build triggers or via command line)
substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REGISTRY: 'suchi-images'
  _API_SERVICE_NAME: 'suchi-api'
  _WEB_SERVICE_NAME: 'suchi-web'
  _CLOUDSQL_CONNECTION_NAME: 'gen-lang-client-0202543132:us-central1:suchi-db'
  _API_URL: 'https://suchi-api-lxiveognla-uc.a.run.app/v1'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Timeout for the entire build
timeout: '1200s'



















